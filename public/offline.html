<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>WIN — Sem conexão</title>
    <link rel="icon" type="image/png" href="/logowin.png" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: #020617;
        color: #cbd5e1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center;
      }
      .card {
        max-width: 360px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 24px;
        padding: 32px 24px;
        backdrop-filter: blur(12px);
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { color: #fff; font-size: 1.25rem; margin: 16px 0 8px; }
      p { font-size: 0.875rem; line-height: 1.5; margin: 0 0 20px; color: #94a3b8; }
      button {
        background: rgba(99,102,241,0.8);
        color: #fff; border: 0; padding: 10px 18px;
        border-radius: 12px; font-weight: 700; font-size: 0.875rem;
        cursor: pointer;
      }
      button:hover { background: rgb(99,102,241); }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logowin.png" alt="WIN" />
      <h1>Sem conexão</h1>
      <p>Você está offline. Verifique sua internet e tente novamente.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
